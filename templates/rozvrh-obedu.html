<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

        <nav class="navbar bg-primary">
            <div class="container-fluid">
                <div class="card col-1 text-center bg-light">
                    <a href="http://127.0.0.1:5500/index.html#" class="icon-link icon-link-hover ms-3" style="--bs-icon-link-transform: translate3d(0, -.125rem, 0);" href="#">
                        <svg xmlns="http://www.w3.org/2000/svg" class="bi" viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                            <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
                        </svg>
                        domovská stránka
                    </a>
                </div>
            </div>
        </nav>
    
<section id="přehled" class="bg-light pt-4 pb-3">
    <div class="container-lg">
        <div class="text-center">
            <h2>Rozvrh Obědů</h2>
        </div>

        <div id="lunch-schedule-container">
            <!-- Lunch schedule will be dynamically inserted here -->
        </div>

    </div>
</section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        async function loadLunchSchedule() {
            try {
                const response = await fetch('/api/lunch-schedule');
                const schedule = await response.json();

                if (schedule.status === 'error') {
                    document.getElementById('lunch-schedule-container').innerHTML = 
                        `<div class="alert alert-danger text-center">${schedule.message}</div>`;
                    return;
                }

                let html = '';
                for (const day of schedule) {
                    const title = `${day.day_name} ${day.formatted_date} ${new Date(day.date).getFullYear()}`;
                    
                    html += `
                    <div class="card shadow mb-3 mx-5 mt-3">
                        <div class="card-body">
                            <h5 class="card-title">${title}</h5>
                            <ul class="list-group">
                                <li class="list-group-item text-start"><b>Polévka:</b>
                                    <div class="card">
                                        <div class="row">
                                            <div class="col ms-2">${day.soup || 'Není v databázi'}</div>
                                        </div>
                                    </div>
                                </li>
                                <li class="list-group-item text-start"><b>Oběd 1:</b>
                                    <div class="card">
                                        <div class="row">
                                            <div class="col ms-2">${day.first || 'Není v databázi'}</div>
                                        </div>
                                    </div>
                                </li>
                                <li class="list-group-item text-start"><b>Oběd 2:</b>
                                    <div class="card">
                                        <div class="row">
                                            <div class="col ms-2">${day.second || 'Není v databázi'}</div>
                                        </div>
                                    </div>
                                </li>
                                <li class="list-group-item text-start"><b>Doplněk:</b>
                                    <div class="card">
                                        <div class="row">
                                            <div class="col ms-2">${day.doplněk || 'Není v databázi'}</div>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                    `;
                }

                document.getElementById('lunch-schedule-container').innerHTML = html;
            } catch (error) {
                console.error('Error loading lunch schedule:', error);
                document.getElementById('lunch-schedule-container').innerHTML = 
                    `<div class="alert alert-danger text-center">Chyba při načítání rozvrhu obědů: ${error.message}</div>`;
            }
        }

        // Load lunch schedule on page load
        loadLunchSchedule();
    </script>
</body>
</html>
