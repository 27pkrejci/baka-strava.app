<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

        <nav class="navbar bg-primary">
            <a class="btn btn-light mx-3" href="/baka-strava.app-main/baka-strava.app-main/templates/index.html" role="button">Domovská stránka</a>
        </nav>
    
<section id="přehled" class="bg-light pt-4 pb-3">
    <div class="container-lg">
        <div class="text-center">
            <h2>Rozvrh Obědů</h2>
        </div>

        <div id="lunch-schedule-container">
            <!-- Lunch schedule will be dynamically inserted here -->
        </div>

    </div>
</section>

<!-- Template for lunch day cards -->
<template id="lunch-day-template">
    <div class="card shadow mb-3 mx-5 mt-3">
        <div class="card-body">
            <h5 class="card-title day-title"></h5>
            <ul class="list-group">
                <li class="list-group-item text-start"><b>Polévka:</b>
                    <div class="card">
                        <div class="row">
                            <div class="col ms-2 soup-item">Není v databázi</div>
                        </div>
                    </div>
                </li>
                <li class="list-group-item text-start"><b>Oběd 1:</b>
                    <div class="card">
                        <div class="row">
                            <div class="col ms-2 first-item">Není v databázi</div>
                        </div>
                    </div>
                </li>
                <li class="list-group-item text-start"><b>Oběd 2:</b>
                    <div class="card">
                        <div class="row">
                            <div class="col ms-2 second-item">Není v databázi</div>
                        </div>
                    </div>
                </li>
                <li class="list-group-item text-start"><b>Doplněk:</b>
                    <div class="card">
                        <div class="row">
                            <div class="col ms-2 doplnek-item">Není v databázi</div>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/static/js/lunch_schedule.js"></script>
</body>
</html>
