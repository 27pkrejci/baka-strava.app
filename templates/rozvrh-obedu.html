<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<section id="přehled" class="bg-light pt-4 pb-3">
    <div class="container-lg">
        <div class="text-center">
            <h2>Rozvrh Obědů</h2>
        </div>

        <div id="lunch-schedule-container">
            <!-- Lunch schedule will be dynamically inserted here -->
        </div>

    </div>
</section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        async function loadLunchSchedule() {
            try {
                const response = await fetch('/api/lunch-schedule');
                const schedule = await response.json();

                if (schedule.status === 'error') {
                    document.getElementById('lunch-schedule-container').innerHTML = 
                        `<div class="alert alert-danger text-center">${schedule.message}</div>`;
                    return;
                }

                let html = '';
                for (const day of schedule) {
                    const title = `${day.day_name} ${day.formatted_date} ${new Date(day.date).getFullYear()}`;
                    
                    html += `
                    <div class="card shadow mb-3 mx-5 mt-3">
                        <div class="card-body">
                            <h5 class="card-title">${title}</h5>
                            <ul class="list-group">
                                <li class="list-group-item text-start"><b>Polévka:</b>
                                    <div class="card">
                                        <div class="row">
                                            <div class="col ms-2">${day.soup || 'Není v databázi'}</div>
                                        </div>
                                    </div>
                                </li>
                                <li class="list-group-item text-start"><b>Oběd 1:</b>
                                    <div class="card">
                                        <div class="row">
                                            <div class="col ms-2">${day.first || 'Není v databázi'}</div>
                                        </div>
                                    </div>
                                </li>
                                <li class="list-group-item text-start"><b>Oběd 2:</b>
                                    <div class="card">
                                        <div class="row">
                                            <div class="col ms-2">${day.second || 'Není v databázi'}</div>
                                        </div>
                                    </div>
                                </li>
                                <li class="list-group-item text-start"><b>Doplněk:</b>
                                    <div class="card">
                                        <div class="row">
                                            <div class="col ms-2">${day.doplněk || 'Není v databázi'}</div>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                    `;
                }

                document.getElementById('lunch-schedule-container').innerHTML = html;
            } catch (error) {
                console.error('Error loading lunch schedule:', error);
                document.getElementById('lunch-schedule-container').innerHTML = 
                    `<div class="alert alert-danger text-center">Chyba při načítání rozvrhu obědů: ${error.message}</div>`;
            }
        }

        // Load lunch schedule on page load
        loadLunchSchedule();
    </script>
</body>
</html>
