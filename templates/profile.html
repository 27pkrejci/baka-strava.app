<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar bg-primary">
        <div class="container-fluid">
            <div class="card col-1 text-center bg-light">
                <a href="/" class="icon-link icon-link-hover ms-3">Domovská stránka</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Profil (volba skupin)</h2>
        <p class="text-muted">Vyberte své skupiny — volba se uloží lokálně v prohlížeči a použije se pro filtrování rozvrhu.</p>

        <div id="groups-container" class="mb-3">
            Načítání skupin...
        </div>

        <div>
            <button id="save-btn" class="btn btn-primary">Uložit</button>
            <button id="clear-btn" class="btn btn-secondary ms-2">Vymazat výběr</button>
        </div>

        <div id="status" class="mt-3"></div>
    </div>

    <script>
        async function loadGroups() {
            try {
                const res = await fetch('/api/groups');
                const data = await res.json();
                const container = document.getElementById('groups-container');
                container.innerHTML = '';

                if (data.status === 'error') {
                    container.innerHTML = `<div class="text-danger">${data.message}</div>`;
                    return;
                }

                const groups = data.groups || [];
                if (!groups.length) {
                    container.innerHTML = '<div class="text-muted">Žádné skupiny k dispozici.</div>';
                    return;
                }

                // Load saved groups from localStorage
                const saved = JSON.parse(localStorage.getItem('selectedGroups') || '[]');
                const set = new Set(saved);

                for (const g of groups) {
                    const id = `grp-${g.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
                    const div = document.createElement('div');
                    div.className = 'form-check';
                    div.innerHTML = `
                        <input class="form-check-input" type="checkbox" value="${g}" id="${id}" ${set.has(g) ? 'checked' : ''}>
                        <label class="form-check-label" for="${id}">${g}</label>
                    `;
                    container.appendChild(div);
                }

            } catch (err) {
                document.getElementById('groups-container').innerHTML = `<div class="text-danger">Chyba načítání: ${err.message}</div>`;
            }
        }

        document.getElementById('save-btn').addEventListener('click', () => {
            const checks = Array.from(document.querySelectorAll('#groups-container input[type=checkbox]'));
            const picked = checks.filter(c => c.checked).map(c => c.value);
            localStorage.setItem('selectedGroups', JSON.stringify(picked));
            document.getElementById('status').innerHTML = '<div class="text-success">Uloženo lokálně.</div>';
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            localStorage.removeItem('selectedGroups');
            loadGroups();
            document.getElementById('status').innerHTML = '<div class="text-muted">Výběr vymazán.</div>';
        });

        // Initial load
        loadGroups();
    </script>
</body>
</html>
