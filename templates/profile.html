<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar bg-primary">
        <a class="btn btn-light mx-3" href="/baka-strava.app-main/baka-strava.app-main/templates/index.html" role="button">Domovská stránka</a>
    </nav>

    <div class="container mt-4">
        <h2>Profil (volba třídy a skupin)</h2>
        <p class="text-muted">Vyberte svou třídu a skupiny, volba se uloží lokálně v prohlížeči a použije se pro filtrování rozvrhu</p>

        <div id="class-container" class="mb-3">
            <label for="class-select" class="form-label">Vyberte třídu:</label>
            <select id="class-select" class="form-select">
                <option value="">Načítání tříd...</option>
            </select>
        </div>

        <div id="groups-container" class="mb-3" style="display: none;">
            <label class="form-label">Vyberte skupiny:</label>
            <div id="groups-list">Vyberte třídu nejprve.</div>
        </div>

        <div id="buttons" style="display: none;">
            <button id="save-btn" class="btn btn-primary">Uložit</button>
            <button id="clear-btn" class="btn btn-secondary ms-2">Vymazat výběr</button>
        </div>

        <div id="status" class="mt-3"></div>
    </div>

    <!-- Template for group checkbox items -->
    <template id="group-checkbox-template">
        <div class="form-check">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label"></label>
        </div>
    </template>

    <script src="/static/js/profile.js"></script>
</body>
</html>
